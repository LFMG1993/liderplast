name = "liderplast"
compatibility_date = "2024-08-13"

[pages]
# Directorio que contiene los archivos estáticos del frontend (generado por `npm run deploy`).
build_output_dir = "dist"

# Directorio que contiene el código del backend (el Worker).
# Esta es la sintaxis correcta que Cloudflare Pages espera.
functions_dir = "/packages/backend"